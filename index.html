<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Shree Balaji Borewell</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div class="language-switch">
    <button onclick="setLanguage('hi')">हिन्दी</button>
    <button onclick="setLanguage('en')">English</button>
  </div>

  <h1 data-lang-hi="पार्टी प्रविष्टि फॉर्म" data-lang-en="Party Entry Form">पार्टी प्रविष्टि फॉर्म</h1>

  <!-- ✅ यहाँ पर फॉर्म Merge कर रहे हैं -->
  <form action="https://shreebalajiborwell.infinityfreeapp.com/submit_entry.php" method="POST">
    <label data-lang-hi="पार्टी का नाम" data-lang-en="Party Name">
      पार्टी का नाम:
      <input type="text" name="party_name" placeholder="पार्टी का नाम" required>
    </label>
    <br><br>
    <button type="submit" data-lang-hi="जमा करें" data-lang-en="Submit">जमा करें</button>
  </form>

</body>
</html>
