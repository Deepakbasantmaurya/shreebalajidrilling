<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shree Balaji Drilling</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo" data-i18n="title">श्री बालाजी ड्रिलिंग</div>
    <div class="language-switcher">
      <button onclick="setLanguage('hi')">हिंदी</button>
      <button onclick="setLanguage('en')">English</button>
    </div>
  </nav>

  <header>
    <h1 data-i18n="welcome">आपका स्वागत है</h1>
    <p data-i18n="description">हम बोरिंग और पाइप सर्विसेज प्रदान करते हैं</p>
  </header>

  <section>
    <h2 data-i18n="services">हमारी सेवाएं</h2>
    <ul>
      <li data-i18n="boring_service">बोरिंग सेवा</li>
      <li data-i18n="pipe_service">पाइप फिटिंग</li>
      <li data-i18n="commission_tracking">कमीशन ट्रैकिंग</li>
    </ul>
  </section>

  <script src="lang.js"></script>
</body>
</html>
